// same markup as report_template.html
function chip(side, cid, type){
  if (!side) return '<span class="chip none">—</span>';
  const c = side.crit[cid];
  if (!c) return `<span class="chip none">${t('c.missing')}</span>`;
  const p = type === 'exclusion' ? 'E' : 'I';
  const m = c.v === 1 ? ['✓', t('c.' + p + '1'), 'pos'] : c.v === -1 ? ['✗', t('c.' + p + '-1'), 'neg'] : c.v === 0 ? ['?', t('c.0'), 'unk'] : ['!', String(c.v), 'none'];
  const miss = (PUB ? c.nf : (c.v === 1 || c.v === -1) && !c.span) ? `<span class="w" title="${esc(t('c.nf'))}">⚠</span>` : '';
  return `<span class="chip ${m[2]}">${m[0]} ${esc(m[1])}${miss}</span>`;
}
function pill(side){
  return `<span class="pill ${side.overall}" title="score ${side.score}">${ROBO('a', 15)}A · ${side.overall === 'include' ? t('v.inc') : t('v.exc')}</span>`;
}
function markText(text, spans, focus, fmtSections){
  const cuts = new Set([0, text.length]);
  spans.forEach(x => { cuts.add(x.s); cuts.add(x.e); });
  const pts = [...cuts].sort((a, b) => a - b);
  let out = '';
  for (let i = 0; i < pts.length - 1; i++){
    const s = pts[i], e = pts[i + 1], txt = esc(text.slice(s, e));
    const fmt = x => !fmtSections ? x : x.replace(/(^|\s)([A-Z][A-Z &\/]{2,}[A-Z]):(?=\s)/g, (m, p0, l, off) => (off > 0 || s > 0 ? '\n' : '') + `<span class="sec">${l}:</span>`);
    const tags = spans.filter(x => x.s <= s && x.e >= e).map(x => x.tag);
    if (!tags.length){ out += fmt(txt); continue; }
    const cls = ['q'];
    if (focus && tags.includes('a:' + focus)) cls.push('fa');
    out += `<mark class="${cls.join(' ')}" title="${esc(tags.map(x => x.replace(/^a:/, 'A ')).join(', '))}">${fmt(txt)}</mark>`;
  }
  return out;
}
function abstractHTML(r, focus){
  const sp = {title: [], abstract: []};
  for (const [cid, c] of Object.entries(r.a.crit)) if (c.span) sp[c.src || 'abstract'].push({s:c.span[0], e:c.span[1], tag:'a:' + cid});
  const ttl = `<div class="atitle"><span class="sec">${t('ab.title')}</span> ${markText(r.title || '', sp.title, focus, false)}</div>`;
  const ab = r.abstract ? markText(r.abstract, sp.abstract, focus, true) : `<span class="empty">${t(PUB && r.has_abstract ? 'ab.hidden' : 'ab.none')}</span>`;
  return `<div class="abstract${focus ? ' focus' : ''}">${ttl}${ab}</div>`;
}
function matrixHTML(rv, r, focus){
  let h = `<div class="mxw"><table class="mx"><thead><tr><th colspan="2">${t('mx.crit')}</th><th class="c">${ROBO('a')} A</th></tr></thead><tbody>`;
  for (const [type, label] of [['inclusion', t('mx.inc')], ['exclusion', t('mx.exc')]]){
    const cs = rv.criteria.filter(c => c.type === type);
    if (!cs.length) continue;
    h += `<tr class="grp"><td colspan="3">${label}</td></tr>`;
    for (const c of cs) h += `<tr class="row${focus === c.id ? ' sel' : ''}" data-cid="${esc(c.id)}"><td class="cid">${esc(c.id)}</td><td class="ctext">${esc(c.text)}</td><td class="cv">${chip(r.a, c.id, c.type)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}
function quotesHTML(rv, r, focus){
  if (!focus) return `<div class="qs"><div class="qh">${t('q.title')}</div><span class="note">${t('q.hint')}</span></div>`;
  const cdef = rv.criteria.find(c => c.id === focus) || {text:''}, c = r.a.crit[focus];
  let body = chip(r.a, focus, cdef.type) + ' ';
  if (c && c.q) body += `“${esc(c.q)}”` + (c.span ? (c.src === 'title' ? ` <span class="note">${t('q.fromTitle')}</span>` : '') : ` <span class="miss">${t('q.nf')}</span>`);
  else if (PUB && c && c.qlen) body += `<span class="note">${t('q.hidden', c.qlen)}</span>` + (c.nf ? ` <span class="miss">${t('q.nf')}</span>` : '');
  else body += `<span class="note">${t('q.noq')}</span>`;
  if (c && c.note) body += `<div class="note">${esc(c.note)}</div>`;
  return `<div class="qs"><div class="qh">${esc(focus)} · ${esc(cdef.text)}</div><div class="qr"><span class="tag a">${ROBO('a', 18)}</span><div>${body}</div></div></div>`;
}
function metaHTML(r){
  return [`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(r.pmid)}/" target="_blank" rel="noopener">PMID ${esc(r.pmid)}</a>`, esc(r.journal || ''), esc(r.year || ''), `rank ${esc(r.rank)}`].filter(Boolean).join(' · ');
}
function bodyHTML(rv, r){
  const key = rv.review_pmid + r.pmid;
  if (!(key in focusMap)) focusMap[key] = (rv.criteria.find(c => r.a.crit[c.id] && r.a.crit[c.id].v === -1) || {}).id || null;
  const focus = focusMap[key];
  return `<div class="body" data-pmid="${esc(r.pmid)}"><div>${abstractHTML(r, focus)}</div><div class="rside">${matrixHTML(rv, r, focus)}${quotesHTML(rv, r, focus)}</div></div>`;
}
const marks = r => (r.included ? `<span class="mk inc">${t('mk.inc')}</span>` : '') + (r.added ? `<span class="mk add">${t('mk.add')}</span>` : '') + (!(PUB ? r.has_abstract : r.abstract) ? `<span class="badge">${t('b.noab')}</span>` : '');

function renderCmp(){
  let h = `<table class="e3t"><thead><tr><th>${t('c.rv')}</th><th>${t('c.pop')}</th><th class="n">${t('c.n')}</th><th class="n">${t('c.inc')}</th><th class="n">Recall@20</th><th class="n">Recall@50</th></tr></thead><tbody>`;
  for (const rv of DATA.reviews){
    for (const pop of ['all_hits', 'original']){
      const m = rv.eval.recall_at_k[pop];
      h += `<tr><td>${pop === 'all_hits' ? esc(rv.review_pmid) : ''}</td><td>${t('pop.' + pop)}</td><td class="n">${m.n}</td><td class="n">${m.n_included_in_pool} / ${rv.eval.n_included}</td><td class="n">${f3(m['@20'].in_pool.recall)}</td><td class="n">${f3(m['@50'].in_pool.recall)}</td></tr>`;
    }
    const ref = rv.eval.reference_without;
    if (ref) h += `<tr><td></td><td colspan="5" class="sm">${esc(t('ref', ref.criterion, f3(ref.original['@20'].in_pool.recall), f3(ref.original['@50'].in_pool.recall)))}</td></tr>`;
  }
  h += `<tr class="orig"><td colspan="2">${t('c.orig')}</td><td class="n">2,000</td><td class="n">—</td><td class="n">0.567</td><td class="n">0.713</td></tr>`;
  $('#cmp').innerHTML = h + '</tbody></table>';
}
function renderSearch(rv){
  const s = rv.eval.search;
  $('#search').innerHTML = `<div class="stats"><div class="stat"><div class="k">${t('se.n')}</div><div class="v">${s.n_all}</div></div><div class="stat hl"><div class="k">${t('se.r')}</div><div class="v">${f3(s.recall_all)}<small>${s.hit_all}/${rv.eval.n_included}</small></div></div></div>
    <div class="ph">${t('se.q')}</div><pre class="qbox">${esc(rv.query)}</pre>
    <div class="sm">${t('se.miss')}：${s.missed.length ? s.missed.map(p => `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p)}/" target="_blank" rel="noopener">${esc(p)}</a>`).join('、') : '—'}</div>`;
}
function renderScreen(rv){
  const ir = rv.eval.included_ranks.original;
  $('#rk').innerHTML = `<div class="ph">${t('rk.title')}</div><div class="e3w"><table class="e3t"><thead><tr><th>PMID</th><th class="n">${t('rk.pos')}</th><th class="n">${t('rk.sc')}</th><th>${t('rk.minus')}</th></tr></thead><tbody>${ir.map(x => `<tr><td>${esc(x.pmid)}${x.added ? `<span class="mk add">${t('mk.add')}</span>` : ''}</td><td class="n">${x.position}</td><td class="n">${x.score}</td><td>${esc(x.minus.join('・') || '—')}</td></tr>`).join('')}</tbody></table></div>`;
  const list = rv.records.slice(0, shown);
  let h = `<div class="rtw" style="margin-top:14px"><table class="rt"><thead><tr><th>${t('rt.pos')}</th><th>${t('rt.title')}</th><th>${t('rt.sc')}</th><th>${t('rt.a')}</th></tr></thead><tbody>`;
  for (const r of list){
    const key = rv.review_pmid + r.pmid, open = openRows.has(key);
    h += `<tr class="rr${open ? ' open' : ''}${r.included ? ' isinc' : ''}" data-pmid="${esc(r.pmid)}"><td class="num">${r.position}</td><td class="tt">${esc(r.title)}${marks(r)}<small>${metaHTML(r)}</small></td><td class="sc">${r.a.score}</td><td>${pill(r.a)}</td></tr>`;
    if (open) h += `<tr><td class="rdet" colspan="4">${bodyHTML(rv, r)}</td></tr>`;
  }
  h += '</tbody></table></div>';
  if (shown < rv.records.length) h += `<div class="more"><span>${t('more', shown, rv.records.length)}</span><button class="btn" data-more="100">${t('more.btn')}</button><button class="btn" data-more="all">${t('more.all')}</button></div>`;
  $('#list').innerHTML = h;
}

// ---- 抽出の採点（指示書20 6.2）. Draft in localStorage like eval-2; saved to results/extraction/human/<review>.json ----
const X = DATA.extraction;
const xmem = {};
let xOnly = false, xDirName = null;
const xkey = it => it.pmid + '\t' + it.name;
function xhuman(){
  const out = {};
  for (const rid of (X ? X.reviews : [])){
    if (!xmem[rid]){
      const m = Object.assign({}, X.human[rid] || {}, PUB ? {} : store.get('slr-extract-human-' + rid) || {});
      for (const k of Object.keys(m)) if (m[k] !== true && m[k] !== false) delete m[k];
      xmem[rid] = m;
    }
    out[rid] = xmem[rid];
  }
  return out;
}
function xset(rid, key, val){
  xhuman();
  if (val === null) delete xmem[rid][key]; else xmem[rid][key] = val;
  const draft = store.get('slr-extract-human-' + rid) || {};
  draft[key] = val;   // null = cleared (overrides a saved score)
  store.set('slr-extract-human-' + rid, draft);
}
const pct = m => m.accuracy == null ? '—' : `${f3(m.accuracy)} <span class="sm">(${f3(m.ci_low)}–${f3(m.ci_high)})</span>`;
function xrow(cls, label, m){
  return `<tr class="${cls}"><td>${label}</td><td class="n">${m.total}</td><td class="n">${m.rule_correct}</td><td class="n">${m.human_correct}</td><td class="n">${m.human_wrong}</td><td class="n">${m.pending}</td><td class="n">${pct(m)}</td></tr>`;
}
function xquotes(it){
  if (PUB) return it.qcount ? `<div class="sm">${t('x.qhidden', it.qcount)}</div>` : '';
  if (!it.ctx.length) return '';
  return it.ctx.map(c => c.nf ? `<div class="xq nf">“${esc(c.q)}” ${t('x.nf')}</div>`
    : `<div class="xq">${esc(c.before)}<mark>${esc(c.match)}</mark>${esc(c.after)}</div>`).join('');
}
function xscore(it, h){
  if (it.auto === 'correct') return `<span class="xb ok">${t('x.autoOk')}</span>`;
  const v = h[xkey(it)];
  if (PUB) return v === true ? `<span class="xb ok">${t('x.hok')}</span>` : v === false ? `<span class="xb ng">${t('x.hng')}</span>` : `<span class="sm">${t('x.hnone')}</span>`;
  return `<div class="seg" data-k="${esc(xkey(it))}"><button class="inc ${v === true ? 'on' : ''}" data-x="1">${t('x.ok')}</button><button class="exc ${v === false ? 'on' : ''}" data-x="0">${t('x.ng')}</button></div>`;
}
function renderX(rv){
  const el = $('#xt');
  if (!X || !X.reviews.includes(rv.review_pmid)){ el.innerHTML = `<p class="sm">${t('s.extract.todo')}</p>`; return; }
  const H = xhuman(), M = extractionMetrics(X.items, H);
  let h = `<div class="xrules"><div class="xh">${t('x.rules.h')}</div><ol>${t('x.rules').map(x => `<li>${esc(x)}</li>`).join('')}</ol><div class="sm">${t('x.auto')}</div></div>`;
  h += `<div class="stats"><div class="stat hl"><div class="k">${t('x.all')} Accuracy</div><div class="v">${M.overall.accuracy == null ? '—' : f3(M.overall.accuracy)}<small>${M.overall.correct}/${M.overall.scored}</small></div></div>`
    + `<div class="stat"><div class="k">95% CI</div><div class="v">${M.overall.accuracy == null ? '—' : f3(M.overall.ci_low) + '–' + f3(M.overall.ci_high)}</div></div>`
    + `<div class="stat"><div class="k">${t('x.pend')}</div><div class="v">${M.overall.pending}<small>/ ${M.overall.total}</small></div></div></div>`;
  h += `<div class="ph" style="margin-top:12px">${t('x.acc')}</div><div class="e3w"><table class="e3t"><thead><tr><th>${t('x.lvl')}</th><th class="n">${t('x.items')}</th><th class="n">${t('x.rc')}</th><th class="n">${t('x.hc')}</th><th class="n">${t('x.hw')}</th><th class="n">${t('x.pend')}</th><th class="n">${t('x.accc')}</th></tr></thead><tbody>`;
  h += xrow('lvl0', t('x.all'), M.overall);
  for (const rid of X.reviews){
    h += xrow('lvl1', 'Review ' + esc(rid), M.by_review[rid]);
    for (const [pk, m] of Object.entries(M.by_pair)) if (pk.startsWith(rid + '/')) h += xrow('lvl2', 'PMID ' + esc(pk.split('/')[1]), m);
  }
  const ex = X.reference_exclude || [];
  if (ex.length){
    const R = extractionMetrics(X.items.filter(it => !ex.includes(it.review + '/' + it.pmid)), H);
    h += xrow('lvl0', esc(t('x.ref', ex.join(', '))), R.overall);
    for (const rid of X.reviews) if (R.by_review[rid]) h += xrow('lvl1', 'Review ' + esc(rid), R.by_review[rid]);
  }
  h += `</tbody></table></div><p class="sm">${t('x.orig')}</p>`;
  if (X.breakdown){
    h += `<div class="ph" style="margin-top:12px">${t('x.bd')}</div><div class="e3w"><table class="e3t"><thead><tr><th>${t('x.lvl')}</th><th class="n">${t('x.bd.ans')}</th><th class="n">${t('x.bd.body')}</th><th class="n">${t('x.bd.nobody')}</th><th class="n">${t('x.bd.nopmc')}</th><th class="n">${t('x.bd.nr')}</th><th class="n">${t('x.bd.nrw')}</th></tr></thead><tbody>`;
    for (const rid of X.reviews){
      const b = X.breakdown[rid], nr = X.items.filter(it => it.review === rid && it.value.trim() === '記載なし');
      const nrw = nr.filter(it => H[rid][xkey(it)] === false).length;
      h += `<tr><td>Review ${esc(rid)}</td><td class="n">${b.body.length + b.pmc_no_body.length + b.no_pmc.length}</td><td class="n">${b.body.length}</td><td class="n">${b.pmc_no_body.length}</td><td class="n">${b.no_pmc.length}</td><td class="n">${nr.length}</td><td class="n">${nrw}</td></tr>`;
    }
    h += `</tbody></table></div><p class="sm">${t('x.bd.foot')}</p>`;
  }
  if (!PUB) h += `<div class="xbar"><button class="btn primary" data-xa="save">${t('x.save')}</button><button class="btn" data-xa="redir">${t('x.redir')}</button><label><input type="checkbox" data-xa="only" ${xOnly ? 'checked' : ''}> ${t('x.only')}</label><span class="sm">${xDirName ? esc(t('x.dir', xDirName)) : t('x.nodir')}</span></div>`;
  const its = X.items.filter(it => it.review === rv.review_pmid);
  const shownIts = its.filter(it => !xOnly || (it.auto === null && H[rv.review_pmid][xkey(it)] === undefined));
  if (!shownIts.length) h += `<p class="sm">${t('x.done')}</p>`;
  let lastPmid = null;
  for (const it of shownIts){
    if (it.pmid !== lastPmid){
      if (lastPmid !== null) h += '</tbody></table></div>';
      h += `<h4 class="xp"><a href="https://pubmed.ncbi.nlm.nih.gov/${esc(it.pmid)}/" target="_blank" rel="noopener">${t('x.pair', esc(it.pmid))}</a></h4><div class="e3w"><table class="e3t xi"><thead><tr><th>${t('x.items')}</th><th>${t('x.ans')}</th><th>${t('x.val')}</th><th>${t('x.sc')}</th></tr></thead><tbody>`;
      lastPmid = it.pmid;
    }
    const todo = it.auto === null && H[rv.review_pmid][xkey(it)] === undefined;
    h += `<tr class="${todo ? 'todo' : ''}"><td class="nm">${esc(it.name)}</td><td class="ans">${esc(it.answer)}</td><td><div class="xv">${esc(it.value)}</div>${xquotes(it)}</td><td class="sc">${xscore(it, H[rv.review_pmid])}</td></tr>`;
  }
  if (lastPmid !== null) h += '</tbody></table></div>';
  el.innerHTML = h;
}
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3200); }
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function isoLocal(){
  const d = new Date(), z = -d.getTimezoneOffset(), p = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${z >= 0 ? '+' : '-'}${p(z / 60)}:${p(z % 60)}`;
}
// the chosen folder handle is kept in IndexedDB so the folder is picked only once
const IDB = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('slr-extract', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); v === undefined ? tx.objectStore('kv').delete(k) : tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
function xdocs(){
  const H = xhuman(), at = isoLocal();
  return X.reviews.map(rid => ({review_pmid: rid, saved_at: at, records: X.items
    .filter(it => it.review === rid && it.auto === null && (H[rid][xkey(it)] === true || H[rid][xkey(it)] === false))
    .map(it => ({pmid: it.pmid, item: it.name, correct: H[rid][xkey(it)]}))}));
}
async function xsave(){
  const docs = xdocs(), n = docs.reduce((a, d) => a + d.records.length, 0);
  if (window.showDirectoryPicker){
    try {
      let dir = null;
      try { dir = await IDB.get('dir'); } catch(e){}
      if (dir && (await dir.queryPermission({mode:'readwrite'})) !== 'granted' && (await dir.requestPermission({mode:'readwrite'})) !== 'granted') dir = null;
      if (!dir){
        dir = await window.showDirectoryPicker({id:'slr-extract-human', mode:'readwrite'});
        if (dir.name !== 'human' && !confirm(t('x.notHuman', dir.name))) return;
        try { await IDB.put('dir', dir); } catch(e){}
      }
      for (const d of docs){
        const w = await (await dir.getFileHandle(d.review_pmid + '.json', {create:true})).createWritable();
        await w.write(JSON.stringify(d, null, 2) + '\n'); await w.close();
      }
      xDirName = dir.name; render(); toast(t('x.saved', n, dir.name)); return;
    } catch(e){
      if (e && e.name === 'AbortError') return;
      console.warn('File System Access failed, falling back to download', e);
    }
  }
  for (const d of docs) download(d.review_pmid + '.json', JSON.stringify(d, null, 2) + '\n', 'application/json');
  toast(t('x.dl'));
}
function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#pubnote').hidden = !PUB; $('#pubnote').textContent = t('pub.note');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('.lg [data-t="lg.a"]').forEach(el => { el.innerHTML = ROBO('a', 14) + ' ' + esc(t('lg.a')); });
  $('#reviews').innerHTML = DATA.reviews.map((r, i) => `<button data-i="${i}" aria-pressed="${i === cur}"><span class="rvt">${esc(rtitle(r))}</span><span class="rvm tnum">PMID ${esc(r.review_pmid)} · ${r.records.length}</span></button>`).join('');
  const rv = DATA.reviews[cur];
  $('#rtitle').textContent = rtitle(rv);
  $('#rsub').textContent = t('sub', rv.review_pmid, rv.criteria.length, DATA.generated_at);
  renderCmp(); renderSearch(rv); renderScreen(rv); renderX(rv);
}
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.lang; store.raw('slr-lang', lang); render(); });
$('#theme').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; store.raw('slr-theme', r.dataset.theme); });
$('#reviews').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cur = +b.dataset.i; shown = 100; render(); });
$('#list').addEventListener('click', e => {
  const rv = DATA.reviews[cur];
  const more = e.target.closest('[data-more]');
  if (more){ shown = more.dataset.more === 'all' ? rv.records.length : shown + 100; render(); return; }
  if (e.target.closest('a')) return;
  const row = e.target.closest('.mx tr.row');
  if (row){ const body = row.closest('.body'), key = rv.review_pmid + body.dataset.pmid; focusMap[key] = focusMap[key] === row.dataset.cid ? null : row.dataset.cid; render(); return; }
  const tr = e.target.closest('tr.rr');
  if (tr){ const key = rv.review_pmid + tr.dataset.pmid; openRows.has(key) ? openRows.delete(key) : openRows.add(key); render(); }
});
$('#xt').addEventListener('click', e => {
  const rv = DATA.reviews[cur];
  const b = e.target.closest('[data-x]');
  if (b && !PUB){
    const k = b.closest('.seg').dataset.k, val = b.dataset.x === '1', curv = xhuman()[rv.review_pmid][k];
    const y = window.scrollY; xset(rv.review_pmid, k, curv === val ? null : val); render(); window.scrollTo(0, y); return;
  }
  const a = e.target.closest('[data-xa]');
  if (!a || PUB) return;
  if (a.dataset.xa === 'save') xsave();
  if (a.dataset.xa === 'redir'){ IDB.put('dir', undefined).catch(() => {}); xDirName = null; render(); }
});
$('#xt').addEventListener('change', e => { if (e.target.dataset.xa === 'only'){ xOnly = e.target.checked; render(); } });
render();
})();
