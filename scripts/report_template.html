<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PubMed SLR Screening — HerzLeben</title>
<script>
try {
  var t = localStorage.getItem('slr-theme');
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var l = localStorage.getItem('slr-lang');
  document.documentElement.lang = l || ((navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en');
} catch (e) {}
</script>
<style>
/* Design tokens: same as the Medicare Part D app (web/app/globals.css) */
:root{
  color-scheme:light;
  --surface:#fcfcfb; --surface-raised:#ffffff; --surface-sunken:#f2f1ee;
  --border:#e3e2dd; --border-strong:#cfcec8;
  --ink:#0b0b0b; --ink-secondary:#52514e; --ink-muted:#8a8983;
  --accent:#007a76; --accent-soft:#eaf7f6; --brand:#01a09b; --brand-hover:#01908b;
  --nav:#011b4a; --side:#eef8f7; --side-line:#cfe8e6;
  --danger:#c8332f; --danger-soft:#fdeceb;
  --series-1:#008f8a; --series-3:#4a3aa7; --claude:#d97757;
  --o:#011b4a; --j:#52514e; --a:var(--series-1); --a-soft:rgba(0,143,138,.16); --b:var(--series-3); --b-soft:rgba(74,58,167,.14);
  --mark:rgba(11,11,11,.06);
  --radius:10px; --shadow-card:0 1px 2px rgb(11 11 11 / .04),0 1px 8px rgb(11 11 11 / .03);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --surface-raised:#232322; --surface-sunken:#131312;
  --border:#35352f; --border-strong:#4a4a43;
  --ink:#ffffff; --ink-secondary:#c3c2b7; --ink-muted:#8d8c83;
  --accent:#33bfba; --accent-soft:#12302f; --brand:#01a09b; --brand-hover:#01908b;
  --nav:#011b4a; --side:#142826; --side-line:#244543;
  --danger:#e66767; --danger-soft:#33201f;
  --series-1:#01a09b; --series-3:#9085e9; --j:#a9a89e; --o:#8fa3d6;
  --a-soft:rgba(1,160,155,.26); --b-soft:rgba(144,133,233,.22); --mark:rgba(255,255,255,.08);
  --shadow-card:0 1px 2px rgb(0 0 0 / .3),0 1px 8px rgb(0 0 0 / .2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--ink);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
html[lang="ja"]{word-break:auto-phrase;line-break:strict}
p,li,td,th{text-wrap:pretty}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:root[data-theme="dark"] .only-light{display:none}
:root:not([data-theme="dark"]) .only-dark{display:none}

/* header */
.nav{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;height:60px;display:flex;align-items:center;gap:12px;padding-left:16px}
.nav img{height:28px;width:auto;display:block}
.nav .div{width:1px;height:24px;background:rgba(255,255,255,.2)}
.nav h1{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chipn{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);border-radius:999px;padding:2px 10px 2px 7px;font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap}
.chipn .dot{width:8px;height:8px;border-radius:50%;background:var(--claude)}
.bdg{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px 8px;font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap}
.bdg.dummy{border-color:rgba(255,255,255,.6);color:#fff;font-weight:600;letter-spacing:.04em}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:6px;height:100%}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:6px;overflow:hidden;font-size:11px}
.lang button{border:0;background:transparent;color:rgba(255,255,255,.6);padding:4px 8px;cursor:pointer}
.lang button[aria-pressed=true]{background:rgba(255,255,255,.15);color:#fff}
.ibtn{border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8);border-radius:6px;padding:6px;cursor:pointer;display:flex}
.ibtn:hover{border-color:rgba(255,255,255,.6);color:#fff}
.brandbar{margin-left:8px;height:100%;background:var(--brand);color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 20px}
.brandbar:hover{background:var(--brand-hover)}
.brandbar b{font-size:12px;line-height:1.2}
.brandbar span{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85)}

/* shell */
.shell{display:flex;min-height:calc(100% - 60px)}
aside.side{width:264px;flex-shrink:0;background:var(--side);border-right:1px solid var(--side-line);padding:20px;display:flex;flex-direction:column;gap:20px}
.sec{border:1px solid var(--border);background:var(--surface-raised);border-radius:8px}
.sec h2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink-secondary);margin:0;padding:8px 12px}
.sec h2 svg{color:var(--accent)}
.sec .in{border-top:1px solid var(--border);padding:12px}
.rvb{display:flex;flex-direction:column;gap:4px}
.rvb button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-raised);border-radius:6px;padding:6px 8px;cursor:pointer;font-size:11px;line-height:1.4;color:var(--ink-secondary)}
.rvb button .rvt{display:block;color:var(--ink);font-weight:600;font-size:12px;line-height:1.4}
.rvb button .rvm{display:block;color:var(--ink-muted);font-size:10.5px;margin-top:1px}
.rvb button .rvp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:6px;font-size:10.5px;color:var(--ink-secondary)}
.rvb button .rvp .ok{color:var(--accent);font-weight:600}
.rvb .track{height:3px}
.rvb button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rvb button[aria-pressed=true] .rvt{color:var(--accent)}
.prog .lab{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-muted);margin:0 0 6px}
.prog .lab svg{color:var(--accent)}
.track{height:4px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.prog p{font-size:11px;color:var(--ink-muted);margin:6px 0 0}
.sbtn{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-raised);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:500;color:var(--ink-secondary);cursor:pointer;text-align:left}
.sbtn:hover{border-color:var(--accent);color:var(--ink)}
.sbtn svg{color:var(--accent);flex-shrink:0}
.sbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.sbtn.primary svg{color:#fff}
:root[data-theme="dark"] .sbtn.primary{color:#0b1f1e}
:root[data-theme="dark"] .sbtn.primary svg{color:#0b1f1e}
.stack{display:flex;flex-direction:column;gap:6px}
.lg{font-size:11px;color:var(--ink-secondary);display:flex;flex-direction:column;gap:6px}
.lg .sw{display:inline-block;width:24px;height:11px;vertical-align:-1px;margin-right:6px;border-radius:2px}
.sw.a{background:var(--a-soft)} .sw.b{box-shadow:inset 0 -3px 0 var(--b)}
.credit{margin-top:auto;display:flex;align-items:center;gap:12px;border:1px solid var(--side-line);border-radius:8px;padding:10px 12px;text-decoration:none}
.credit:hover{border-color:var(--accent)}
.credit img{height:36px;width:auto}
.credit small{display:block;font-size:10px;color:var(--ink-muted);line-height:1.4}
.credit b{display:block;font-size:12px;color:var(--ink)}

main{flex:1;min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 48px}

/* pipeline illustration */
.pipe{border:1px solid var(--border);border-top:3px solid var(--brand);border-radius:var(--radius);background:var(--surface-raised);box-shadow:var(--shadow-card);padding:12px 16px 6px;margin-bottom:24px}
.pipe h3{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0}
.pipe h3 svg{color:var(--accent)}
.pipe svg.scene{width:100%;height:auto;display:block}
.scene text{font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.scene .lbl{font-size:12px;font-weight:600;fill:var(--ink)}
.scene .cap{font-size:10.5px;fill:var(--ink-muted)}
.scene .paper{fill:var(--surface-raised);stroke:var(--border-strong);stroke-width:1.2}
.scene .ln{stroke:var(--border-strong);stroke-width:2;stroke-linecap:round}
.scene .flow{fill:none;stroke:var(--border-strong);stroke-width:1.5;stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
.scene .bus{fill:none;stroke:var(--o);stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:3 4}
.scene .pkt{fill:var(--o)}
.bot.o .bb{animation-delay:1.1s}
@keyframes dash{to{stroke-dashoffset:-18}}
.fly{animation:fly 3.2s ease-in-out infinite;opacity:0}
.fly.b{animation-delay:.25s}
.fly.late{animation-delay:1.6s} .fly.b.late{animation-delay:1.85s}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}60%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.9)}72%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.9)}}
.bot .bb{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box}
.bot.b .bb{animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.bot.b .eye{animation-delay:1.3s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ant{animation:pulse 1.2s ease-in-out infinite}
.bot.b .ant{animation-delay:.6s}
@keyframes pulse{50%{opacity:.35}}
.scan{animation:scan 1.6s ease-in-out infinite alternate}
.bot.b .scan{animation-delay:.5s}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(26px)}}
.pop{opacity:0;animation:pop 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,20%{opacity:0;transform:translateY(4px) scale(.6)}30%,70%{opacity:1;transform:translateY(0) scale(1)}85%,100%{opacity:0;transform:translateY(-6px)}}
.scale-beam{animation:tilt 3.2s ease-in-out infinite;transform-origin:560px 62px}
.bot.j .bb{animation-delay:.8s}.bot.j .eye{animation-delay:2.1s}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(6deg)}}
@media (prefers-reduced-motion: reduce){.scene *{animation:none!important}.pkt{display:none}.pop{opacity:1}.fly{display:none}}

/* heading & stats */
.rh{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;margin:0}
.rh svg{color:var(--accent)}
.sub{font-size:11px;color:var(--ink-muted);margin:2px 0 16px 26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow-card)}
.stat .k{font-size:11px;color:var(--ink-muted)}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font-size:11px;font-weight:500;color:var(--ink-muted);margin-left:5px;letter-spacing:0}
.stat.hl{border-color:var(--accent);background:var(--accent-soft)}
.stat.hl .v{color:var(--accent)}
.stat.alert .v small{color:var(--danger)}
details.warns{background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:var(--radius);padding:8px 12px;margin-bottom:16px;font-size:12px}
details.warns summary{cursor:pointer;color:var(--danger);font-weight:600}
details.warns ul{margin:6px 0 0;padding-left:18px;color:var(--ink-secondary)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;background:var(--surface-sunken);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--ink-secondary);font-size:13px}
.tabs button[aria-selected=true]{background:var(--surface-raised);color:var(--ink);font-weight:600;box-shadow:var(--shadow-card)}
.tabs .n{color:var(--ink-muted);margin-left:5px;font-weight:400;font-variant-numeric:tabular-nums}
.search{flex:1;min-width:180px;max-width:300px;border:1px solid var(--border);background:var(--surface-raised);border-radius:8px;padding:6px 10px;color:var(--ink);font:inherit;font-size:13px}
.search:focus{outline:none;border-color:var(--accent)}

/* cards */
.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow-card)}
.card.open{border-top:3px solid var(--brand)}
.head{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;padding:12px 16px;cursor:pointer}
.rank{font-size:11px;color:var(--ink-muted);padding-top:2px;font-variant-numeric:tabular-nums}
.ttl{font-size:14px;font-weight:600;line-height:1.45}
.meta{font-size:11px;color:var(--ink-muted);margin-top:2px}
.meta a{color:var(--ink-muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--border);color:var(--ink-secondary);background:var(--surface-sunken)}
.badge.todo{border-color:var(--accent);color:var(--accent);background:transparent;font-weight:600}
.badge.ok{border-color:transparent;color:var(--accent);background:var(--accent-soft)}
.badge.ng{border-color:transparent;color:var(--danger);background:var(--danger-soft)}
.badge.warn{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger);background:transparent}
.ab{display:flex;gap:6px;white-space:nowrap}
.pill{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600;display:flex;align-items:center;gap:5px;background:var(--surface-sunken);color:var(--ink-secondary)}
.robo{display:inline-block;vertical-align:-3px;flex-shrink:0}
.pill.include{color:var(--accent);background:var(--accent-soft)}
.pill.exclude{color:var(--danger);background:var(--danger-soft)}
.body{display:none;border-top:1px solid var(--border);padding:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.card.open .body{display:grid}
.abstract{font-size:14.5px;line-height:1.85;white-space:pre-wrap}
.abstract .empty{color:var(--ink-muted);font-size:13px}
.abstract .atitle{font-weight:600;white-space:normal;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--border);line-height:1.6}
.abstract .sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-muted)}
mark.q{background:var(--mark);color:inherit;border-radius:2px;padding:1px 0}
.focus mark.q{background:transparent}
.focus mark.q.fa{background:var(--a-soft)}
.focus mark.q.fb{box-shadow:inset 0 -3px 0 var(--b)}
.rside{display:flex;flex-direction:column;gap:12px;min-width:0}
.adj{border-left:2px solid var(--accent);padding:2px 0 2px 12px;font-size:13px;color:var(--ink-secondary)}
.adj .who{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:2px}
.adj .who svg{color:var(--accent)}
.mxw{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table.mx{width:100%;border-collapse:collapse;font-size:12.5px}
table.mx thead th{background:var(--surface-sunken);font-size:11px;color:var(--ink-secondary);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
table.mx th.c{text-align:center;width:92px}
table.mx th .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
table.mx tr.grp td{font-size:10.5px;color:var(--ink-muted);padding:8px 8px 3px;font-weight:600;letter-spacing:.03em}
table.mx tr.row{cursor:pointer}
table.mx tr.row td{padding:6px 8px;border-top:1px solid var(--border);vertical-align:top}
table.mx tr.row:hover td{background:var(--surface-sunken)}
table.mx tr.row.diff td{background:color-mix(in srgb,var(--b-soft) 55%,transparent)}
table.mx tr.row.sel td{background:var(--accent-soft)}
table.mx tr.row.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.cid{font-weight:600;width:32px;font-variant-numeric:tabular-nums}
td.ctext{color:var(--ink-secondary);line-height:1.45}
td.cv{text-align:center}
.chip{display:inline-flex;gap:3px;align-items:center;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap}
.chip.pos{background:var(--accent-soft);color:var(--accent)}
.chip.neg{background:var(--danger-soft);color:var(--danger)}
.chip.unk{background:var(--surface-sunken);color:var(--ink-secondary)}
.chip.none{background:transparent;color:var(--ink-muted)}
.chip .w{color:var(--danger)}
.qs{font-size:12.5px;background:var(--surface-sunken);border-radius:8px;padding:8px 12px}
.qs .qh{font-size:11px;color:var(--ink-muted);font-weight:600;margin-bottom:4px}
.qs .qr{display:grid;grid-template-columns:22px 1fr;gap:6px;margin:5px 0}
.qs .tag{font-weight:700}
.qs .tag.a{color:var(--a)} .qs .tag.b{color:var(--b)}
.qs .note{color:var(--ink-muted);font-size:11.5px}
.qs .miss{color:var(--danger);font-size:11.5px;font-weight:600}
.human{border:1px solid var(--accent);border-radius:var(--radius);padding:10px 12px;background:var(--surface-raised)}
.human .hh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-raised);padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-secondary)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on.inc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button.on.exc{background:var(--danger-soft);color:var(--danger);font-weight:600}
.human input{width:100%;margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface-raised);color:var(--ink);font:inherit;font-size:12.5px}
.human input:focus{outline:none;border-color:var(--accent)}
.empty-list{color:var(--ink-muted);padding:32px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);font-size:13px}
.foot{font-size:11px;color:var(--ink-muted);margin-top:24px;line-height:1.7}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* pages */
.pages{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-8px 0 20px}
.pages a{display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--ink-secondary);text-decoration:none;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.pages a:hover{color:var(--ink)}
.pages a[aria-current=page]{color:var(--ink);font-weight:600;border-bottom-color:var(--brand)}
.pages .num{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface-sunken);color:var(--ink-secondary)}
.pages a[aria-current=page] .num{background:var(--brand);color:#fff}
.pages .cnt{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
:root[data-theme="dark"] .pages .cnt{color:#0b1f1e}
.rhead{margin-bottom:16px}.rhead .sub{margin-bottom:0}
.lead{font-size:14px;color:var(--ink-secondary);margin:0 0 16px;max-width:760px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-raised);box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:16px}
.grid2 .panel{margin-bottom:0}
.ph{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px}
.phrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.phrow .ph{margin:0}
.fbar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.fbar span{display:block;height:100%}
.f-exc{background:var(--border-strong)} .f-inc{background:var(--accent)}
.f-hum{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,var(--accent-soft) 4px 8px)}
.flist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;font-size:13px;align-items:center}
.flist i{width:12px;height:12px;border-radius:3px;display:block}
.flist b{font-variant-numeric:tabular-nums;text-align:right}
.flist .tot{grid-column:1/-1;border-top:1px solid var(--border);padding-top:8px;margin-top:2px;display:flex;justify-content:space-between;font-weight:600}
.flist .tot b{color:var(--accent);font-size:18px}
.flist small{color:var(--ink-muted);font-weight:400}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.steps li:last-child{border-bottom:0}
.steps .n{width:20px;height:20px;border-radius:50%;background:var(--surface-sunken);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink-secondary)}
.steps .d{color:var(--ink-muted);font-size:11.5px}
.who2{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.who2.h{background:var(--accent-soft);color:var(--accent)} .who2.c{background:var(--surface-sunken);color:var(--ink-secondary)}
.steps li.you{background:var(--accent-soft);border-radius:6px;padding:6px;border-bottom:0}
.steps li.you .n{background:var(--brand);color:#fff}
.cta{display:flex;justify-content:flex-end;gap:10px}
.btn{border:1px solid var(--border);background:var(--surface-raised);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink-secondary);display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#0b1f1e}
.btn:disabled{opacity:.4;cursor:default}
.dtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.dpos{font-size:13px;color:var(--ink-secondary)}.dpos b{font-size:18px;color:var(--ink)}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dots button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface-raised);font-size:11px;cursor:pointer;color:var(--ink-secondary);font-variant-numeric:tabular-nums}
.dots button.inc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dots button.exc{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.dots button.cur{box-shadow:0 0 0 2px var(--brand)}
.dnav{display:flex;gap:6px}
.hint{font-size:11.5px;color:var(--ink-muted);margin:0 0 12px}
.dcard .body{display:grid}
.decide{position:sticky;bottom:0;z-index:5;margin-top:12px;background:var(--surface-raised);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:0 -4px 16px rgb(0 0 0 / .06);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.decide .hh{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:flex;gap:6px;align-items:center}
.decide input{flex:1;min-width:200px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--surface-raised);color:var(--ink);font:inherit;font-size:13px}
.decide input:focus{outline:none;border-color:var(--accent)}
.decide .seg button{padding:7px 16px;font-size:13px}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:10px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:4px;color:var(--ink-muted)}
.done{text-align:center;padding:36px 16px;border:1px dashed var(--accent);border-radius:var(--radius);background:var(--accent-soft)}
.done h3{margin:0 0 6px;font-size:16px;color:var(--accent)}
.done p{margin:0 0 14px;color:var(--ink-secondary);font-size:13px}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{font-size:11px;color:var(--ink-secondary);font-weight:500;text-align:left;padding:6px 8px;background:var(--surface-sunken);border-bottom:1px solid var(--border)}
table.rt td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
table.rt tr.rr{cursor:pointer} table.rt tr.rr:hover td{background:var(--surface-sunken)}
table.rt tr.rr.open td{background:var(--accent-soft)}
table.rt td.num{color:var(--ink-muted);font-variant-numeric:tabular-nums;width:44px}
table.rt td.tt{font-weight:500} table.rt td.tt small{display:block;color:var(--ink-muted);font-weight:400;font-size:11px}
table.rt td.rdet{background:var(--surface);padding:0}
table.rt td.rdet .body{display:grid;border-top:0}
.rtw{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ebars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ebars button{display:grid;grid-template-columns:minmax(0,260px) 1fr 40px;gap:10px;align-items:center;border:0;background:transparent;cursor:pointer;padding:3px 4px;border-radius:6px;text-align:left;font-size:12.5px;color:var(--ink-secondary)}
.ebars button:hover{background:var(--surface-sunken)}
.ebars button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.ebars .tr{height:10px;background:var(--surface-sunken);border-radius:999px;overflow:hidden}
.ebars .tr i{display:block;height:100%;background:var(--border-strong);border-radius:999px}
.ebars b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.ebars .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (max-width:960px){.grid2{grid-template-columns:1fr}.ebars button{grid-template-columns:minmax(0,140px) 1fr 32px}}
@media (max-width:1100px){.chipn,.bdg{display:none}}

  .credit{display:none}

  .nav{position:static}

}
@media (max-width:560px){.head{grid-template-columns:28px 1fr}.head .ab{grid-column:2}.wrap{padding:20px 16px}.nav h1{font-size:13px}}

function decOf(rv, pmid){
  const k = rv.review_pmid;
  if (!mem[k]) mem[k] = Object.assign({}, rv.human, store.get('slr-human-' + k) || {});
  return mem[k][pmid] || null;
}
function setDecision(rv, pmid, patch){
  const k = rv.review_pmid;
  decOf(rv, pmid);
  mem[k][pmid] = Object.assign({decision:null, note:''}, mem[k][pmid] || {}, patch);
  const draft = store.get('slr-human-' + k) || {};
  draft[pmid] = mem[k][pmid];
  store.set('slr-human-' + k, draft);
}
function classify(rv){
  const inc = [], exc = [], hum = [];
  let pending = 0;
  for (const r of rv.records){
    if (r.status === 'needs_human'){
      hum.push(r);
      const d = decOf(rv, r.pmid);
      if (d && d.decision === 'include') inc.push(r);
      else if (d && d.decision === 'exclude') exc.push(r);
      else pending++;
    } else if (r.status === 'agreed_include') inc.push(r);
    else exc.push(r);
  }
  const tot = s => (s.a ? s.a.score : 0) + (s.b ? s.b.score : 0);
  inc.sort((x, y) => tot(y) - tot(x) || x.rank - y.rank);
  return {inc, exc, hum, pending};
}
const ROBO = (who, size = 16) => `<svg class="robo" width="${size}" height="${size}" viewBox="0 0 20 20" aria-hidden="true"><line x1="10" y1="2.6" x2="10" y2="5" stroke="var(--${who})" stroke-width="1.4"/><circle cx="10" cy="2.4" r="1.6" fill="var(--${who})"/><rect x="2.5" y="5" width="15" height="12.5" rx="3.6" fill="var(--${who})"/><rect x="5" y="7.6" width="10" height="6.2" rx="2" fill="var(--surface-raised)"/><ellipse cx="8.2" cy="10.7" rx="1" ry="1.35" fill="var(--${who})"/><ellipse cx="11.8" cy="10.7" rx="1" ry="1.35" fill="var(--${who})"/></svg>`;

function chip(side, cid, type){
  if (!side) return '<span class="chip none">—</span>';
  const c = side.crit[cid];
  if (!c) return `<span class="chip none">${t('c.missing')}</span>`;
  const p = type === 'exclusion' ? 'E' : 'I';
  const m = c.v === 1 ? ['✓', t('c.' + p + '1'), 'pos'] : c.v === -1 ? ['✗', t('c.' + p + '-1'), 'neg'] : c.v === 0 ? ['?', t('c.0'), 'unk'] : ['!', String(c.v), 'none'];
  const miss = (c.v === 1 || c.v === -1) && !c.span ? `<span class="w" title="${esc(t('c.nf'))}">⚠</span>` : '';
  return `<span class="chip ${m[2]}">${m[0]} ${esc(m[1])}${miss}</span>`;
}
function pill(side, who){
  const dot = ROBO(who.toLowerCase(), 15);
  if (!side) return `<span class="pill">${dot}${who} · ${t('v.none')}</span>`;
  return `<span class="pill ${side.overall}" title="score ${side.score}">${dot}${who} · ${side.overall === 'include' ? t('v.inc') : t('v.exc')}</span>`;
}

function markText(text, spans, focus, fmtSections){
  const cuts = new Set([0, text.length]);
  spans.forEach(x => { cuts.add(x.s); cuts.add(x.e); });
  const pts = [...cuts].sort((a, b) => a - b);
  let out = '';
  for (let i = 0; i < pts.length - 1; i++){
    const s = pts[i], e = pts[i + 1], txt = esc(text.slice(s, e));
    const fmt = x => !fmtSections ? x : x.replace(/(^|\s)([A-Z][A-Z &\/]{2,}[A-Z]):(?=\s)/g, (m, p0, l, off) => (off > 0 || s > 0 ? '\n' : '') + `<span class="sec">${l}:</span>`);
    const tags = spans.filter(x => x.s <= s && x.e >= e).map(x => x.tag);
    if (!tags.length){ out += fmt(txt); continue; }
    const cls = ['q'];
    if (focus && tags.includes('a:' + focus)) cls.push('fa');
    if (focus && tags.includes('b:' + focus)) cls.push('fb');
    const title = tags.map(x => x.replace(/^a:/, 'A ').replace(/^b:/, 'B ')).join(', ');
    out += `<mark class="${cls.join(' ')}" title="${esc(title)}">${fmt(txt)}</mark>`;
  }
  return out;
}
function abstractHTML(r, focus){
  const sp = {title: [], abstract: []};
  for (const who of ['a', 'b']){
    const s = r[who]; if (!s) continue;
    for (const [cid, c] of Object.entries(s.crit)) if (c.span) sp[c.src || 'abstract'].push({s:c.span[0], e:c.span[1], tag:who + ':' + cid});
  }
  const ttl = `<div class="atitle"><span class="sec">${t('ab.title')}</span> ${markText(r.title || '', sp.title, focus, false)}</div>`;
  const ab = r.abstract ? markText(r.abstract, sp.abstract, focus, true) : `<span class="empty">${t('ab.none')}</span>`;
  return `<div class="abstract${focus ? ' focus' : ''}">${ttl}${ab}</div>`;
}

function quotesHTML(rv, r, focus){
  if (!focus) return `<div class="qs"><div class="qh">${t('q.title')}</div><span class="note">${t('q.hint')}</span></div>`;
  const cdef = rv.criteria.find(c => c.id === focus) || {text:''};
  let h = `<div class="qs"><div class="qh">${esc(focus)} · ${esc(ctext(cdef))}</div>`;
  for (const who of ['a', 'b']){
    const s = r[who], c = s && s.crit[focus];
    let body;
    if (!s) body = `<span class="note">${t('q.nojudge')}</span>`;
    else if (!c) body = `<span class="miss">${t('q.nocrit')}</span>`;
    else {
      body = chip(s, focus, cdef.type) + ' ';
      if (c.q) body += `“${esc(c.q)}”` + (c.span ? (c.src === 'title' ? ` <span class="note">${t('q.fromTitle')}</span>` : '') : ` <span class="miss">${t('q.nf')}</span>`);
      else body += `<span class="note">${t('q.noq')}</span>`;
      if (c.note) body += `<div class="note">${esc(c.note)}</div>`;
    }
    h += `<div class="qr"><span class="tag ${who}">${ROBO(who, 18)}</span><div>${body}</div></div>`;
  }
  return h + '</div>';
}

function matrixHTML(rv, r, focus){
  let h = `<div class="mxw"><table class="mx"><thead><tr><th colspan="2">${t('mx.crit')}</th><th class="c">${ROBO('a')} A</th><th class="c">${ROBO('b')} B</th></tr></thead><tbody>`;
  for (const [type, label] of [['inclusion', t('mx.inc')], ['exclusion', t('mx.exc')]]){
    const cs = rv.criteria.filter(c => c.type === type);
    if (!cs.length) continue;
    h += `<tr class="grp"><td colspan="4">${label}</td></tr>`;
    for (const c of cs){
      h += `<tr class="row${r.disagree.includes(c.id) ? ' diff' : ''}${focus === c.id ? ' sel' : ''}" data-cid="${esc(c.id)}"><td class="cid">${esc(c.id)}</td><td class="ctext">${esc(ctext(c))}</td><td class="cv">${chip(r.a, c.id, c.type)}</td><td class="cv">${chip(r.b, c.id, c.type)}</td></tr>`;
    }
  }
  return h + '</tbody></table></div>';
}

function humanHTML(rv, r){
  if (r.status !== 'needs_human') return '';
  const d = decOf(rv, r.pmid) || {};
  return `<div class="human"><div class="hh"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5" r="2.6"/><path d="M3 14c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/></svg>${t('h.title')}</div>
    <div class="seg"><button class="inc ${d.decision === 'include' ? 'on' : ''}" data-dec="include">${t('h.inc')}</button><button class="exc ${d.decision === 'exclude' ? 'on' : ''}" data-dec="exclude">${t('h.exc')}</button></div>
    <input type="text" data-note placeholder="${esc(t('h.note'))}" value="${esc(d.note || '')}"></div>`;
}

function statusBadges(rv, r){
  const b = [];
  if (r.status === 'needs_human'){
    const d = decOf(rv, r.pmid);
    b.push(d && d.decision ? `<span class="badge ${d.decision === 'include' ? 'ok' : 'ng'}">${t(d.decision === 'include' ? 'b.hinc' : 'b.hexc')}</span>` : `<span class="badge todo">● ${t('b.todo')}</span>`);
    for (const x of r.reasons) if (x !== 'criterion_disagree') b.push(`<span class="badge warn">${esc(t('r.' + x))}</span>`);
    if (r.disagree.length && !r.reasons.includes('missing_record')) b.push(`<span class="badge">${t('b.split', r.disagree.join('・'))}</span>`);
  } else {
    b.push(`<span class="badge ${r.status === 'agreed_include' ? 'ok' : 'ng'}">${t(r.status === 'agreed_include' ? 'b.agI' : 'b.agE')}</span>`);
    if (r.status === 'agreed_exclude'){
      const neg = rv.criteria.filter(c => [r.a, r.b].some(s => s && s.crit[c.id] && s.crit[c.id].v === -1)).map(c => c.id);
      if (neg.length) b.push(`<span class="badge">${t('b.why', neg.join('・'))}</span>`);
    }
    if (r.reasons.includes('criterion_disagree')) b.push(`<span class="badge">${esc(t('r.criterion_disagree'))}: ${r.disagree.join('・')}</span>`);
  }
  if (r.mismatch) b.push(`<span class="badge warn">${t('b.mismatch', esc(r.rule_status))}</span>`);
  if (!r.abstract) b.push(`<span class="badge">${t('b.noab')}</span>`);
  return b.join('');
}

function metaHTML(r){
  return [`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(r.pmid)}/" target="_blank" rel="noopener">PMID ${esc(r.pmid)}</a>`, esc(r.journal || ''), esc(r.year || '')].filter(Boolean).join(' · ');
}
function bodyHTML(rv, r){
  const focus = focusMap[rv.review_pmid + r.pmid] || null;
  const summ = (lang === 'en' && r.summary_en) || r.summary;
  const adj = summ ? `<div class="adj"><div class="who">${ROBO('j', 15)}adjudicator</div>${esc(summ)}</div>` : '';
  return `<div class="body" data-pmid="${esc(r.pmid)}"><div>${abstractHTML(r, focus)}</div><div class="rside">${adj}${matrixHTML(rv, r, focus)}${quotesHTML(rv, r, focus)}</div></div>`;
}
function primaryReason(rv, r){
  if (r.status === 'needs_human') return 'human';
  const c = rv.criteria.find(c => [r.a, r.b].some(s => s && s.crit[c.id] && s.crit[c.id].v === -1));
  return c ? c.id : '?';
}
function initFocus(rv, r){
  const key = rv.review_pmid + r.pmid;
  if (key in focusMap) return;
  let f = r.disagree[0] || null;
  if (!f) for (const who of ['a', 'b']){ const s = r[who]; if (!s) continue;
    for (const [cid, c] of Object.entries(s.crit)) if ((c.v === 1 || c.v === -1) && !c.span){ f = cid; break; } if (f) break; }
  focusMap[key] = f;
}

let page = 'overview', dIdx = 0, excFilter = null;
const openRows = new Set();

function renderPages(hum, pending){
  const items = [['overview', t('pg.overview')], ['decide', t('pg.decide')], ['results', t('pg.results')]];
  $('#pages').innerHTML = items.map(([k, l], i) => `<a href="#/${k}" data-page="${k}" ${page === k ? 'aria-current="page"' : ''}><span class="num">${i + 1}</span>${l}${k === 'decide' && pending ? `<span class="cnt">${pending}</span>` : ''}</a>`).join('');
  for (const k of ['overview', 'decide', 'results']) $('#pg-' + k).hidden = page !== k;
}

function renderOverview(rv, c){
  const n = rv.records.length;
  const agI = rv.records.filter(r => r.status === 'agreed_include').length;
  const agE = rv.records.filter(r => r.status === 'agreed_exclude').length;
  const H = c.hum.length, pct = x => (n ? x / n * 100 : 0) + '%';
  const both = rv.records.filter(r => r.a && r.b), agree = both.filter(r => r.a.overall === r.b.overall).length;
  $('#funnel').innerHTML = `
    <div class="fbar" role="img" aria-label="funnel"><span class="f-exc" style="width:${pct(agE)}"></span><span class="f-inc" style="width:${pct(agI)}"></span><span class="f-hum" style="width:${pct(H)}"></span></div>
    <div class="flist">
      <span></span><span>${t('fn.cand')}</span><b>${n}</b>
      <i class="f-exc"></i><span>${t('fn.agE')}</span><b>${agE}</b>
      <i class="f-inc"></i><span>${t('fn.agI')}</span><b>${agI}</b>
      <i class="f-hum"></i><span>${t('fn.hum')} <small>${c.pending ? t('st.pending', c.pending) : t('st.done')}</small></span><b>${H}</b>
      <div class="tot"><span>${t('fn.final')} ${c.pending ? `<small>${t('st.plus', c.pending)}</small>` : ''}</span><b>${c.inc.length}</b></div>
    </div>
    <p class="hint" style="margin:10px 0 0">${t('fn.agree', both.length ? Math.round(agree / both.length * 100) : 0, agree, both.length)}</p>`;
  const batches = Math.ceil(n / 20);
  const steps = [
    ['h', t('s1'), t('s1d', rv.criteria.length)],
    ['h', t('s2'), t('s2d')],
    ['c', t('s3'), t('s3d', n)],
    ['c', t('s4'), t('s4d', batches)],
    ['c', t('s5'), t('s5d', H)],
    ['you', t('s6'), t('s6d', c.pending)],
  ];
  $('#steps').innerHTML = steps.map(([w, a, d], i) => `<li class="${w === 'you' ? 'you' : ''}"><span class="n">${i + 1}</span><span>${a}<div class="d">${d}</div></span><span class="who2 ${w === 'c' ? 'c' : 'h'}">${w === 'c' ? 'Claude Code' : t('who.h')}</span></li>`).join('');
  $('#warns').innerHTML = rv.warnings.length ? `<details class="warns"><summary>${t('warns', rv.warnings.length)}</summary><ul>${rv.warnings.map(([code, p]) => `<li>${esc(t('w.' + code, p))}</li>`).join('')}</ul></details>` : '';
  $('#cta').innerHTML = c.pending
    ? `<a class="btn primary" href="#/decide">${t('cta.decide', c.pending)} →</a>`
    : `<a class="btn primary" href="#/results">${t('cta.results')} →</a>`;
}

function renderDecide(rv, c){
  const hum = c.hum;
  if (!hum.length){ $('#dpos').textContent = ''; $('#dots').innerHTML = ''; $('#dcard').innerHTML = `<div class="done"><h3>${t('d.none')}</h3><a class="btn primary" href="#/results">${t('cta.results')} →</a></div>`; return; }
  dIdx = Math.max(0, Math.min(dIdx, hum.length - 1));
  const r = hum[dIdx]; initFocus(rv, r);
  const d = decOf(rv, r.pmid) || {};
  $('#dpos').innerHTML = `<b>${dIdx + 1}</b> / ${hum.length} · ${c.pending ? t('st.pending', c.pending) : t('st.done')}`;
  $('#dots').innerHTML = hum.map((x, i) => { const dd = decOf(rv, x.pmid); const cls = dd && dd.decision === 'include' ? 'inc' : dd && dd.decision === 'exclude' ? 'exc' : ''; return `<button data-di="${i}" class="${cls} ${i === dIdx ? 'cur' : ''}" title="PMID ${esc(x.pmid)}">${i + 1}</button>`; }).join('');
  $('#prev').disabled = dIdx === 0; $('#next').disabled = dIdx === hum.length - 1;
  const doneBox = !c.pending ? `<div class="done" style="margin-bottom:12px"><h3>${t('d.alldone')}</h3><p>${t('d.alldone2', rv.review_pmid)}</p><button class="btn primary" data-act="save">${t('side.save')}</button> <a class="btn" href="#/results">${t('cta.results')} →</a></div>` : '';
  $('#dcard').innerHTML = `${doneBox}<article class="card open dcard" data-pmid="${esc(r.pmid)}">
    <div class="head" style="cursor:default"><div class="rank">#${esc(r.rank)}</div>
      <div><div class="ttl">${esc(r.title)}</div><div class="meta tnum">${metaHTML(r)}</div><div class="badges">${statusBadges(rv, r)}</div></div>
      <div class="ab">${pill(r.a, 'A')}${pill(r.b, 'B')}</div></div>
    ${bodyHTML(rv, r)}
  </article>
  <div class="decide" data-pmid="${esc(r.pmid)}">
    <span class="hh">${t('h.title')}</span>
    <div class="seg"><button class="inc ${d.decision === 'include' ? 'on' : ''}" data-dec="include">${t('h.inc')}<kbd>I</kbd></button><button class="exc ${d.decision === 'exclude' ? 'on' : ''}" data-dec="exclude">${t('h.exc')}<kbd>E</kbd></button></div>
    <input type="text" data-note placeholder="${esc(t('h.note'))}" value="${esc(d.note || '')}">
  </div>`;
}

function tableHTML(rv, list, withSource){
  if (!list.length) return `<div class="empty-list">${t('empty')}</div>`;
  let h = `<div class="rtw"><table class="rt"><thead><tr><th>#</th><th>${t('rt.title')}</th><th>${t('rt.src')}</th><th>A / B</th></tr></thead><tbody>`;
  for (const r of list){
    const key = rv.review_pmid + r.pmid, open = openRows.has(key);
    const dd = decOf(rv, r.pmid);
    const src = r.status === 'needs_human' ? `<span class="badge ${withSource === 'inc' ? 'ok' : 'ng'}">${t('src.h')}</span>${dd && dd.note ? `<div class="hint" style="margin:4px 0 0">${esc(dd.note)}</div>` : ''}`
      : withSource === 'inc' ? `<span class="badge">${t('src.a')}</span>` : `<span class="badge">${t('b.why', primaryReason(rv, r))}</span>`;
    h += `<tr class="rr${open ? ' open' : ''}" data-pmid="${esc(r.pmid)}"><td class="num">#${esc(r.rank)}</td><td class="tt">${esc(r.title)}<small>${metaHTML(r)}</small></td><td>${src}</td><td><div class="ab" style="flex-direction:column;align-items:flex-start">${pill(r.a, 'A')}${pill(r.b, 'B')}</div></td></tr>`;
    if (open){ initFocus(rv, r); h += `<tr><td class="rdet" colspan="4">${bodyHTML(rv, r)}</td></tr>`; }
  }
  return h + '</tbody></table></div>';
}

function renderResults(rv, c){
  $('#rpending').innerHTML = c.pending ? `<div class="pend"><span>${t('r.pending', c.pending)}</span><a class="btn primary" href="#/decide">${t('cta.decide', c.pending)} →</a></div>` : '';
  $('#incTitle').textContent = t('r.inc', c.inc.length);
  $('#incTable').innerHTML = tableHTML(rv, c.inc, 'inc');
  $('#excTitle').textContent = t('r.exc', c.exc.length);
  const counts = {};
  for (const r of c.exc){ const k = primaryReason(rv, r); counts[k] = (counts[k] || 0) + 1; }
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const max = Math.max(1, ...Object.values(counts));
  const lbl = k => k === 'human' ? t('src.h') : `${k} · ${ctext(rv.criteria.find(x => x.id === k) || {text:''})}`;
  $('#excBars').innerHTML = `<div class="ebars">${keys.map(k => `<button data-ex="${esc(k)}" aria-pressed="${excFilter === k}"><span class="lb" title="${esc(lbl(k))}">${esc(lbl(k))}</span><span class="tr"><i style="width:${counts[k] / max * 100}%"></i></span><b>${counts[k]}</b></button>`).join('')}</div>`;
  const list = excFilter ? c.exc.filter(r => primaryReason(rv, r) === excFilter) : c.exc;
  $('#excTable').innerHTML = tableHTML(rv, list, 'exc');
}

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('.lg [data-t="lg.a"]').forEach(el => { el.innerHTML = ROBO('a', 14) + ' ' + esc(t('lg.a')); });
  document.querySelectorAll('.lg [data-t="lg.b"]').forEach(el => { el.innerHTML = ROBO('b', 14) + ' ' + esc(t('lg.b')); });
  $('#reviews').innerHTML = DATA.reviews.map((r, i) => {
    const k = classify(r), done = k.hum.length - k.pending, w = k.hum.length ? done / k.hum.length * 100 : 100;
    const st = !k.hum.length ? t('rv.none') : k.pending ? t('rv.prog', done, k.hum.length) : t('rv.done');
    return `<button data-i="${i}" aria-pressed="${i === cur}"><span class="rvt">${esc(rtitle(r))}</span><span class="rvm tnum">PMID ${esc(r.review_pmid)} · ${t('rv.cand', r.records.length)}</span><span class="rvp"><span class="track"><i style="width:${w}%"></i></span><span class="tnum ${k.pending ? '' : 'ok'}">${st}</span></span></button>`;
  }).join('');
  const rv = DATA.reviews[cur], c = classify(rv);
  const decided = c.hum.length - c.pending;
  $('#progbar').style.width = c.hum.length ? (decided / c.hum.length * 100) + '%' : '100%';
  $('#progtxt').textContent = c.hum.length ? t('prog', decided, c.hum.length) : t('prog.none');
  $('#savetxt').textContent = t('side.save');
  $('#pipeNeed').textContent = t('pipe.need', c.hum.length);
  $('#rtitle').textContent = rtitle(rv);
  $('#rsub').textContent = t('sub', rv.review_pmid, rv.criteria.length, DATA.generated_at);
  renderPages(c.hum, c.pending);
  $('#legend').closest('.sec').hidden = page === 'overview';
  if (page === 'overview') renderOverview(rv, c);
  if (page === 'decide') renderDecide(rv, c);
  if (page === 'results') renderResults(rv, c);
}

function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2400); }
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function isoLocal(){
  const d = new Date(), z = -d.getTimezoneOffset(), p = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${z >= 0 ? '+' : '-'}${p(z / 60)}:${p(z % 60)}`;
}
function saveJSON(){
  const rv = DATA.reviews[cur];
  const recs = rv.records.filter(r => r.status === 'needs_human').map(r => ({r, d: decOf(rv, r.pmid)}))
    .filter(x => x.d && x.d.decision).map(x => ({pmid: x.r.pmid, decision: x.d.decision, note: x.d.note || ''}));
  download(`${rv.review_pmid}.json`, JSON.stringify({review_pmid: rv.review_pmid, saved_at: isoLocal(), records: recs}, null, 2) + '\n', 'application/json');
  toast(t('toast', recs.length, rv.review_pmid));
}
function saveCSV(){
  const rv = DATA.reviews[cur], {inc} = classify(rv);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['pmid', 'title', 'journal', 'year', 'source', 'score_a', 'score_b', 'note']].concat(inc.map(r => {
    const d = decOf(rv, r.pmid);
    return [r.pmid, r.title, r.journal, r.year, r.status === 'needs_human' ? 'human' : 'agreed', r.a ? r.a.score : '', r.b ? r.b.score : '', d ? d.note : ''];
  }));
  download(`${rv.review_pmid}_include.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\n') + '\n', 'text/csv');
}
function decide(dec){
  const rv = DATA.reviews[cur], hum = classify(rv).hum, r = hum[dIdx]; if (!r) return;
  const d = decOf(rv, r.pmid) || {};
  const val = d.decision === dec ? null : dec;
  setDecision(rv, r.pmid, {decision: val});
  if (val){ // move to the next open one
    const next = hum.findIndex((x, i) => i > dIdx && !(decOf(rv, x.pmid) || {}).decision);
    if (next >= 0) setTimeout(() => { dIdx = next; render(); }, 250);
  }
  render();
}

function route(){
  const h = (location.hash || '').replace('#/', '');
  page = ['overview', 'decide', 'results'].includes(h) ? h : 'overview';
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

if (DATA.label){ const l = $('#label'); l.textContent = DATA.label; l.hidden = false; }
document.querySelector('.lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.lang; store.raw('slr-lang', lang); render(); });
$('#theme').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; store.raw('slr-theme', r.dataset.theme); });
$('#reviews').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cur = +b.dataset.i; dIdx = 0; excFilter = null; render(); });
$('#save').addEventListener('click', saveJSON);
$('#csv').addEventListener('click', saveCSV);
$('#csv2').addEventListener('click', saveCSV);
$('#prev').addEventListener('click', () => { dIdx--; render(); });
$('#next').addEventListener('click', () => { dIdx++; render(); });
$('#dots').addEventListener('click', e => { const b = e.target.closest('[data-di]'); if (!b) return; dIdx = +b.dataset.di; render(); });
document.querySelector('main').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  if (e.target.closest('[data-act="save"]')) { saveJSON(); return; }
  const rv = DATA.reviews[cur];
  const row = e.target.closest('tr.row');
  if (row){ const body = row.closest('[data-pmid]'); const key = rv.review_pmid + body.dataset.pmid; focusMap[key] = focusMap[key] === row.dataset.cid ? null : row.dataset.cid; render(); return; }
  const dec = e.target.closest('[data-dec]'); if (dec){ decide(dec.dataset.dec); return; }
  const rr = e.target.closest('tr.rr'); if (rr){ const key = rv.review_pmid + rr.dataset.pmid; openRows.has(key) ? openRows.delete(key) : openRows.add(key); render(); return; }
  const ex = e.target.closest('[data-ex]'); if (ex){ excFilter = excFilter === ex.dataset.ex ? null : ex.dataset.ex; render(); }
});
document.querySelector('main').addEventListener('change', e => {
  if (!e.target.matches('[data-note]')) return;
  setDecision(DATA.reviews[cur], e.target.closest('[data-pmid]').dataset.pmid, {note: e.target.value});
});
document.addEventListener('keydown', e => {
  if (page !== 'decide' || e.target.matches('input, textarea')) return;
  if (e.key === 'i' || e.key === 'I') decide('include');
  else if (e.key === 'e' || e.key === 'E') decide('exclude');
  else if (e.key === 'ArrowRight' && !$('#next').disabled){ dIdx++; render(); }
  else if (e.key === 'ArrowLeft' && !$('#prev').disabled){ dIdx--; render(); }
});
route();
})();
</script>
</body>
</html>
